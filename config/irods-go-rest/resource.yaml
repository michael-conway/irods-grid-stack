PublicURL: http://localhost:8082
ListenAddr: :8080
WebEnabled: true
TrustForwardedHeaders: false
HTTPReadTimeoutSeconds: 30
HTTPReadHeaderTimeoutSeconds: 5
HTTPWriteTimeoutSeconds: 30
HTTPIdleTimeoutSeconds: 120
HTTPMaxHeaderBytes: 1048576
RestLogLevel: info
CORSAllowedOrigins:
  - http://localhost:8081

IrodsHost: irods-resource
IrodsPort: 1247
IrodsZone: tempZone
IrodsAdminUser: rods
IrodsAdminPassword: rods
IrodsAdminPasswordFile:
IrodsAdminLoginType: native
IrodsAuthScheme: native
IrodsNegotiationPolicy: CS_NEG_DONT_CARE
IrodsSSLConfig:
  CACertificateFile:
  CACertificatePath:
  EncryptionKeySize: 32
  EncryptionAlgorithm: AES-256-CBC
  EncryptionSaltSize: 8
  EncryptionNumHashRounds: 16
  VerifyServer: hostname
  DHParamsFile:
  ServerName:
IrodsDefaultResource: resourceResc

S3ApiSupported: true
S3BucketMappingFile: /shared-s3-config/irods-s3-bucket-mapping.json
S3UserMappingFile: /shared-s3-config/irods-s3-user-mapping.json

ReplicaTrimMinCopies: 1
ReplicaTrimMinAgeMinutes: 0
TestResource1: providerResc
TestResource2: resourceResc

OidcUrl: https://keycloak:8443
OidcAuthUrl: https://localhost:8443
OidcClientId: irods-go-rest
OidcClientSecret: change-me
OidcClientSecretFile:
OidcInsecureSkipVerify: true
OidcRealm: drs
OidcScope: openid profile email
